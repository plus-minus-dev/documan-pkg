syntax = "proto3";

package documan.connector_ms.v1;

option go_package = "github.com/plus-minus-dev/documan-pkg/services/gen/connector_ms/v1;connector_msv1";

service ConnectorMSService {
  // ValidateToken проверяет ERP-токен и возвращает accountID.
  rpc ValidateToken(ValidateTokenRequest) returns (ValidateTokenResponse);

  // GetSyncStatus возвращает режим синхронизации для подключения.
  rpc GetSyncStatus(GetSyncStatusRequest) returns (GetSyncStatusResponse);
}

message ValidateTokenRequest {
  string erp_type = 1;
  string token = 2;
}

message ValidateTokenResponse {
  string account_id = 1;
  string org_name = 2;
}

message GetSyncStatusRequest {
  string tenant_id = 1;
  string account_id = 2;
}

message GetSyncStatusResponse {
  // "initial" = массовая загрузка, "incremental" = инкрементальная синхронизация
  string sync_mode = 1;
  bool has_audit_cursor = 2;
}
