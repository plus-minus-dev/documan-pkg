syntax = "proto3";
package documan.core.v1;

option go_package = "github.com/plus-minus-dev/documan-pkg/services/gen/core/v1";

import "google/protobuf/timestamp.proto";

// CorePushService -- отправка данных из core в ERP через connector-ms.
// Направление: core -> connector -> МойСклад.
service CorePushService {
  // connector poll: "есть задачи на push в ERP?"
  rpc GetPushTasks(GetPushTasksRequest) returns (GetPushTasksResponse);

  // connector: "push выполнен"
  rpc AckPushComplete(AckPushCompleteRequest) returns (AckPushCompleteResponse);

  // BFF/solution: "создай задачу на push в ERP"
  rpc CreatePushTask(CreatePushTaskRequest) returns (CreatePushTaskResponse);

  // BFF/solution: "создай ERP-документ из original document"
  rpc CreateERPDocumentFromOriginal(CreateERPDocumentFromOriginalRequest) returns (CreateERPDocumentFromOriginalResponse);
}

// ===== GetPushTasks =====

message GetPushTasksRequest {
  string tenant_id = 1;
  string connection_id = 2;
}

message GetPushTasksResponse {
  repeated PushTask items = 1;
}

message PushTask {
  string task_id = 1;
  string tenant_id = 2;
  string connection_id = 3;
  string erp_entity_type = 4;                         // "supply", "invoicein", ...
  string erp_entity_id = 5;
  bytes payload = 6;                                   // JSON для отправки в ERP
  google.protobuf.Timestamp created_at = 7;           // когда задача создана
}

// ===== AckPushComplete =====

message AckPushCompleteRequest {
  string task_id = 1;
  bool success = 2;
  string error_message = 3;                           // если success=false
  string erp_entity_id = 4;                           // созданный ID ERP-документа
}

message AckPushCompleteResponse {}

// ===== CreatePushTask =====

message CreatePushTaskRequest {
  string tenant_id = 1;
  string connection_id = 2;
  string erp_entity_type = 3;                         // "supply", "invoicein", ...
  string erp_entity_id = 4;                           // UUID сущности (пустой при create)
  bytes payload = 5;                                   // JSON для отправки в ERP
}

message CreatePushTaskResponse {
  string task_id = 1;
}

// ===== CreateERPDocumentFromOriginal =====

message CreateERPDocumentFromOriginalRequest {
  string tenant_id = 1;
  string connection_id = 2;
  string original_doc_id = 3;
  string erp_entity_type = 4;                         // "supply", "invoicein", ...

  string organization_id = 5;
  string counterparty_id = 6;
  string store_id = 7;

  string description = 8;
  bool attach_original_file = 9;

  repeated CreateERPDocumentPosition positions = 10;
}

message CreateERPDocumentPosition {
  int32 original_position_index = 1;
  string assortment_type = 2;                         // "product", "service", "variant", ...
  string assortment_id = 3;
  string quantity = 4;
  int64 price = 5;                                    // minor units, формат МойСклад
  int32 vat = 6;                                      // 0, 10, 20, ...
  string source = 7;                                  // "human" | "machine" — источник матча (тегирование KB)
}

message CreateERPDocumentFromOriginalResponse {
  string task_id = 1;
}
