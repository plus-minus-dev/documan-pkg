syntax = "proto3";
package documan.core.v1;

option go_package = "github.com/plus-minus-dev/documan-pkg/services/gen/core/v1";

import "google/protobuf/timestamp.proto";
import "common/v1/types.proto";

// CoreQueryService -- чтение, вызывает BFF.
service CoreQueryService {
  rpc GetConnection(GetConnectionRequest) returns (GetConnectionResponse);
  rpc ListConnections(ListConnectionsRequest) returns (ListConnectionsResponse);
  rpc ListOriginalDocuments(ListOriginalDocumentsRequest) returns (ListOriginalDocumentsResponse);
  rpc GetOriginalDocument(GetOriginalDocumentRequest) returns (GetOriginalDocumentResponse);
  rpc ListERPEntities(ListERPEntitiesRequest) returns (ListERPEntitiesResponse);
  rpc ListERPDocuments(ListERPDocumentsRequest) returns (ListERPDocumentsResponse);
  rpc GetERPDocument(GetERPDocumentRequest) returns (GetERPDocumentResponse);

  // ERP document counts per entity type for a connection
  rpc GetERPDocumentCounts(GetERPDocumentCountsRequest) returns (GetERPDocumentCountsResponse);
}

// ===== Connection =====

message GetConnectionRequest {
  string tenant_id = 1;
  string connection_id = 2;
}

message GetConnectionResponse {
  ConnectionItem connection = 1;
}

message ListConnectionsRequest {
  string tenant_id = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message ListConnectionsResponse {
  repeated ConnectionItem items = 1;
  int32 total_count = 2;
}

message ConnectionItem {
  string connection_id = 1;
  string tenant_id = 2;
  string erp_type = 3;
  string erp_account_id = 4;
  string name = 5;
  string auth_type = 6;
  bool enabled = 7;
  string status = 8;
  google.protobuf.Timestamp last_sync_at = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
}

// ===== OriginalDocument =====

message ListOriginalDocumentsRequest {
  string tenant_id = 1;
  string doc_type = 2;                        // фильтр, пустой = все
  int32 limit = 3;
  int32 offset = 4;
}

message ListOriginalDocumentsResponse {
  repeated OriginalDocumentItem items = 1;
  int32 total_count = 2;
}

message GetOriginalDocumentRequest {
  string tenant_id = 1;
  string doc_id = 2;
}

message GetOriginalDocumentResponse {
  OriginalDocumentDetails document = 1;
}

message OriginalDocumentItem {
  string tenant_id = 1;
  string doc_id = 2;
  string doc_type = 3;
  string file_batch = 4;
  string file_name = 5;
  string file_ext = 6;
  string file_hash = 7;
  string payload_hash = 8;
  google.protobuf.Timestamp payloaded_at = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
}

message OriginalDocumentDetails {
  string tenant_id = 1;
  string doc_id = 2;
  string doc_type = 3;
  string file_batch = 4;
  string file_name = 5;
  string file_ext = 6;
  string file_hash = 7;
  string payload_hash = 8;
  bytes payload_meta = 9;
  bytes payload_header = 10;
  bytes payload_summary = 11;
  bytes payload_positions = 12;
  google.protobuf.Timestamp payloaded_at = 13;
  google.protobuf.Timestamp created_at = 14;
  google.protobuf.Timestamp updated_at = 15;
  documan.common.v1.S3Ref original_file = 16;
}

// ===== ERPEntity =====

message ListERPEntitiesRequest {
  string tenant_id = 1;
  string connection_id = 2;
  string erp_entity_type = 3;                // "product", "counterparty", ... пустой = все
  int32 limit = 4;
  int32 offset = 5;
}

message ListERPEntitiesResponse {
  repeated ERPEntityItem items = 1;
  int32 total_count = 2;
}

message ERPEntityItem {
  string tenant_id = 1;
  string connection_id = 2;
  string connection_type = 3;
  string erp_entity_type = 4;
  string erp_entity_id = 5;
  string payload_hash = 6;
  google.protobuf.Timestamp payloaded_at = 7;
  google.protobuf.Timestamp erp_updated_at = 8;
  google.protobuf.Timestamp erp_created_at = 9;
  google.protobuf.Timestamp erp_deleted_at = 10;
  bool erp_archived = 11;
  bool archived = 12;
}

// ===== ERPDocument =====

message ListERPDocumentsRequest {
  string tenant_id = 1;
  string connection_id = 2;
  string erp_entity_type = 3;                // "supply", "invoicein", ... пустой = все
  int32 limit = 4;
  int32 offset = 5;
}

message ListERPDocumentsResponse {
  repeated ERPDocumentItem items = 1;
  int32 total_count = 2;
}

message ERPDocumentItem {
  string tenant_id = 1;
  string connection_id = 2;
  string connection_type = 3;
  string erp_entity_type = 4;
  string erp_entity_id = 5;
  string payload_hash = 6;
  google.protobuf.Timestamp payloaded_at = 7;
  google.protobuf.Timestamp erp_updated_at = 8;
  google.protobuf.Timestamp erp_created_at = 9;
  google.protobuf.Timestamp erp_deleted_at = 10;
  bool erp_archived = 11;
  bool archived = 12;
}


message GetERPDocumentRequest {
  string tenant_id = 1;
  string connection_id = 2;
  string erp_entity_type = 3;
  string erp_entity_id = 4;
}

message GetERPDocumentResponse {
  ERPDocumentDetails document = 1;
}

message ERPDocumentDetails {
  string tenant_id = 1;
  string connection_id = 2;
  string connection_type = 3;
  string erp_entity_type = 4;
  string erp_entity_id = 5;
  bytes payload_meta = 6;
  bytes payload_header = 7;
  bytes payload_summary = 8;
  bytes payload_positions = 9;
  string payload_hash = 10;
  google.protobuf.Timestamp payloaded_at = 11;
  google.protobuf.Timestamp erp_updated_at = 12;
  google.protobuf.Timestamp erp_created_at = 13;
  google.protobuf.Timestamp erp_deleted_at = 14;
  bool erp_archived = 15;
  bool archived = 16;
}

// ===== ERPDocumentCounts =====

message GetERPDocumentCountsRequest {
  string tenant_id = 1;
  string connection_id = 2;
}

message GetERPDocumentCountsResponse {
  repeated ERPDocumentCountItem items = 1;
}

message ERPDocumentCountItem {
  string erp_entity_type = 1;
  int32 count = 2;
  google.protobuf.Timestamp max_erp_updated_at = 3;
}
