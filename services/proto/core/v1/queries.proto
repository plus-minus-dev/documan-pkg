syntax = "proto3";
package documan.core.v1;

option go_package = "github.com/plus-minus-dev/documan-pkg/services/gen/core/v1";

import "google/protobuf/timestamp.proto";
import "common/v1/types.proto";

// CoreQueryService -- чтение, вызывает BFF.
service CoreQueryService {
  rpc GetConnection(GetConnectionRequest) returns (GetConnectionResponse);
  rpc ListConnections(ListConnectionsRequest) returns (ListConnectionsResponse);
  rpc ListOriginalDocuments(ListOriginalDocumentsRequest) returns (ListOriginalDocumentsResponse);
  rpc GetOriginalDocument(GetOriginalDocumentRequest) returns (GetOriginalDocumentResponse);
  rpc ListERPEntities(ListERPEntitiesRequest) returns (ListERPEntitiesResponse);
  rpc ListERPDocuments(ListERPDocumentsRequest) returns (ListERPDocumentsResponse);

  // ERP document counts per entity type for a connection
  rpc GetERPDocumentCounts(GetERPDocumentCountsRequest) returns (GetERPDocumentCountsResponse);

  // Matching
  rpc GetMatchingStats(GetMatchingStatsRequest) returns (GetMatchingStatsResponse);
  rpc ListDocumentPairs(ListDocumentPairsRequest) returns (ListDocumentPairsResponse);
  rpc ListDocumentMatchingJobs(ListDocumentMatchingJobsRequest) returns (ListDocumentMatchingJobsResponse);
  rpc ListEntityMatchingJobs(ListEntityMatchingJobsRequest) returns (ListEntityMatchingJobsResponse);
  rpc ListEntityDictionary(ListEntityDictionaryRequest) returns (ListEntityDictionaryResponse);
}

// ===== Connection =====

message GetConnectionRequest {
  string tenant_id = 1;
  string connection_id = 2;
}

message GetConnectionResponse {
  ConnectionItem connection = 1;
}

message ListConnectionsRequest {
  string tenant_id = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message ListConnectionsResponse {
  repeated ConnectionItem items = 1;
  int32 total_count = 2;
}

message ConnectionItem {
  string connection_id = 1;
  string tenant_id = 2;
  string erp_type = 3;
  string erp_account_id = 4;
  string name = 5;
  string auth_type = 6;
  bool enabled = 7;
  string status = 8;
  google.protobuf.Timestamp last_sync_at = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
}

// ===== OriginalDocument =====

message ListOriginalDocumentsRequest {
  string tenant_id = 1;
  string doc_type = 2;                        // фильтр, пустой = все
  int32 limit = 3;
  int32 offset = 4;
}

message ListOriginalDocumentsResponse {
  repeated OriginalDocumentItem items = 1;
  int32 total_count = 2;
}

message GetOriginalDocumentRequest {
  string tenant_id = 1;
  string doc_id = 2;
}

message GetOriginalDocumentResponse {
  OriginalDocumentDetails document = 1;
}

message OriginalDocumentItem {
  string tenant_id = 1;
  string doc_id = 2;
  string doc_type = 3;
  string file_batch = 4;
  string file_name = 5;
  string file_ext = 6;
  string file_hash = 7;
  string payload_hash = 8;
  google.protobuf.Timestamp payloaded_at = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
}

message OriginalDocumentDetails {
  string tenant_id = 1;
  string doc_id = 2;
  string doc_type = 3;
  string file_batch = 4;
  string file_name = 5;
  string file_ext = 6;
  string file_hash = 7;
  string payload_hash = 8;
  bytes payload_meta = 9;
  bytes payload_header = 10;
  bytes payload_summary = 11;
  bytes payload_positions = 12;
  google.protobuf.Timestamp payloaded_at = 13;
  google.protobuf.Timestamp created_at = 14;
  google.protobuf.Timestamp updated_at = 15;
  documan.common.v1.S3Ref original_file = 16;
}

// ===== ERPEntity =====

message ListERPEntitiesRequest {
  string tenant_id = 1;
  string connection_id = 2;
  string erp_entity_type = 3;                // "product", "counterparty", ... пустой = все
  int32 limit = 4;
  int32 offset = 5;
}

message ListERPEntitiesResponse {
  repeated ERPEntityItem items = 1;
  int32 total_count = 2;
}

message ERPEntityItem {
  string tenant_id = 1;
  string connection_id = 2;
  string connection_type = 3;
  string erp_entity_type = 4;
  string erp_entity_id = 5;
  string payload_hash = 6;
  google.protobuf.Timestamp payloaded_at = 7;
  google.protobuf.Timestamp erp_updated_at = 8;
  google.protobuf.Timestamp erp_created_at = 9;
  google.protobuf.Timestamp erp_deleted_at = 10;
  bool erp_archived = 11;
  bool archived = 12;
}

// ===== ERPDocument =====

message ListERPDocumentsRequest {
  string tenant_id = 1;
  string connection_id = 2;
  string erp_entity_type = 3;                // "supply", "invoicein", ... пустой = все
  int32 limit = 4;
  int32 offset = 5;
}

message ListERPDocumentsResponse {
  repeated ERPDocumentItem items = 1;
  int32 total_count = 2;
}

message ERPDocumentItem {
  string tenant_id = 1;
  string connection_id = 2;
  string connection_type = 3;
  string erp_entity_type = 4;
  string erp_entity_id = 5;
  string payload_hash = 6;
  google.protobuf.Timestamp payloaded_at = 7;
  google.protobuf.Timestamp erp_updated_at = 8;
  google.protobuf.Timestamp erp_created_at = 9;
  google.protobuf.Timestamp erp_deleted_at = 10;
  bool erp_archived = 11;
  bool archived = 12;
}

// ===== ERPDocumentCounts =====

message GetERPDocumentCountsRequest {
  string tenant_id = 1;
  string connection_id = 2;
}

message GetERPDocumentCountsResponse {
  repeated ERPDocumentCountItem items = 1;
}

message ERPDocumentCountItem {
  string erp_entity_type = 1;
  int32 count = 2;
  google.protobuf.Timestamp max_erp_updated_at = 3;
}

// ===== Matching: Stats =====

message GetMatchingStatsRequest {
  string tenant_id = 1;
}

message GetMatchingStatsResponse {
  int32 doc_jobs_queued = 1;
  int32 doc_jobs_processing = 2;
  int32 doc_jobs_done = 3;
  int32 doc_jobs_failed = 4;
  int32 doc_jobs_retry = 5;

  int32 ent_jobs_queued = 6;
  int32 ent_jobs_processing = 7;
  int32 ent_jobs_done = 8;
  int32 ent_jobs_failed = 9;

  int32 pairs_strong_match = 10;
  int32 pairs_candidate = 11;
  int32 pairs_ambiguous = 12;
  int32 pairs_not_found = 13;
  int32 pairs_confirmed = 14;
  int32 pairs_with_delta = 15;

  int32 dictionary_entries = 16;
}

// ===== Matching: DocumentPairs =====

message ListDocumentPairsRequest {
  string tenant_id = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message ListDocumentPairsResponse {
  repeated DocumentPairItem items = 1;
  int32 total_count = 2;
}

message DocumentPairItem {
  string id = 1;
  string tenant_id = 2;
  string document_set_id = 3;
  string source_connection_id = 4;    // пустой = original
  string source_doc_id = 5;
  string target_connection_id = 6;    // пустой = original
  string target_doc_id = 7;
  int32 match_score = 8;
  string match_status = 9;           // strong_match | candidate | ambiguous | not_found | confirmed
  string confirmed_by = 10;          // human | autopilot | пустой
  bool has_delta = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp updated_at = 13;
}

// ===== Matching: DocumentMatchingJobs =====

message ListDocumentMatchingJobsRequest {
  string tenant_id = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message ListDocumentMatchingJobsResponse {
  repeated DocumentMatchingJobItem items = 1;
  int32 total_count = 2;
}

message DocumentMatchingJobItem {
  string id = 1;
  string tenant_id = 2;
  string source_connection_id = 3;
  string source_doc_id = 4;
  string target_connection_id = 5;
  string mode = 6;                    // warmup | checkup | routine
  string priority = 7;               // high | normal | low
  string status = 8;                  // queued | processing | done | retry | failed
  int32 attempts = 9;
  string error_message = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
}

// ===== Matching: EntityMatchingJobs =====

message ListEntityMatchingJobsRequest {
  string tenant_id = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message ListEntityMatchingJobsResponse {
  repeated EntityMatchingJobItem items = 1;
  int32 total_count = 2;
}

message EntityMatchingJobItem {
  string id = 1;
  string tenant_id = 2;
  string document_set_id = 3;
  string pair_id = 4;
  string mode = 5;
  string priority = 6;
  string status = 7;
  int32 attempts = 8;
  string error_message = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
}

// ===== Matching: EntityDictionary =====

message ListEntityDictionaryRequest {
  string tenant_id = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message ListEntityDictionaryResponse {
  repeated EntityDictionaryItem items = 1;
  int32 total_count = 2;
}

message EntityDictionaryItem {
  string id = 1;
  string tenant_id = 2;
  string connection_id = 3;
  string entity_type = 4;            // product | counterparty | organization | warehouse
  string fingerprint = 5;
  string entity_id = 6;
  string source = 7;                 // warmup | routine | hitl_manual
  string source_document_set_id = 8;
  string confirmed_by = 9;           // human | autopilot
  google.protobuf.Timestamp last_used_at = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
}
