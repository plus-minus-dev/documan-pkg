syntax = "proto3";
package documan.core.v1;

option go_package = "github.com/plus-minus-dev/documan-pkg/services/gen/core/v1";

import "google/protobuf/timestamp.proto";

service CoreQueryService {
  rpc GetConnection(GetConnectionRequest) returns (GetConnectionResponse);
  rpc ListConnections(ListConnectionsRequest) returns (ListConnectionsResponse);
  rpc ListOriginalDocuments(ListOriginalDocumentsRequest) returns (ListOriginalDocumentsResponse);
  rpc GetOriginalDocument(GetOriginalDocumentRequest) returns (GetOriginalDocumentResponse);
  rpc GetOriginalItemMatches(GetOriginalItemMatchesRequest) returns (GetOriginalItemMatchesResponse);
  rpc GetOriginalPartyMatches(GetOriginalPartyMatchesRequest) returns (GetOriginalPartyMatchesResponse);
  rpc GetOriginalStoreMatch(GetOriginalStoreMatchRequest) returns (GetOriginalStoreMatchResponse);
  rpc StreamOriginalDocumentMatches(StreamOriginalDocumentMatchesRequest) returns (stream OriginalDocumentMatchEvent);
  rpc ListERPEntities(ListERPEntitiesRequest) returns (ListERPEntitiesResponse);
  rpc ListERPDocuments(ListERPDocumentsRequest) returns (ListERPDocumentsResponse);
  rpc GetERPDocument(GetERPDocumentRequest) returns (GetERPDocumentResponse);
  rpc GetERPDocumentCounts(GetERPDocumentCountsRequest) returns (GetERPDocumentCountsResponse);
  rpc ListMatchKB(ListMatchKBRequest) returns (ListMatchKBResponse);
}

// ===== Connection =====

message GetConnectionRequest {
  string tenant_id = 1;
  string connection_id = 2;
}

message GetConnectionResponse {
  ConnectionItem connection = 1;
}

message ListConnectionsRequest {
  string tenant_id = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message ListConnectionsResponse {
  repeated ConnectionItem items = 1;
  int32 total_count = 2;
}

message ConnectionItem {
  string connection_id = 1;
  string tenant_id = 2;
  string erp_type = 3;
  string erp_account_id = 4;
  string name = 5;
  string auth_type = 6;
  bool enabled = 7;
  string status = 8;
  google.protobuf.Timestamp last_sync_at = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
  bytes provider_payload = 12;
  bool etl_eligible = 13;
}

// ===== OriginalDocument =====

message ListOriginalDocumentsRequest {
  string tenant_id = 1;
  string condition = 2;
  int32 limit = 3;
  int32 offset = 4;
  string view = 5; // "queue" | "history" | "" (all)
}

message ListOriginalDocumentsResponse {
  repeated OriginalDocumentEntry items = 1;
  int32 total_count = 2;
}

message GetOriginalDocumentRequest {
  string tenant_id = 1;
  string id = 2;
}

message GetOriginalDocumentResponse {
  OriginalDocumentEntry document = 1;
}

message GetOriginalItemMatchesRequest {
  string tenant_id = 1;
  string connection_id = 2;
  string original_doc_id = 3;
}

message GetOriginalItemMatchesResponse {
  repeated OriginalItemMatch items = 1;
}

message OriginalItemMatch {
  int32 original_position_index = 1;
  string entity_type = 2;
  string entity_id = 3;
}

message GetOriginalPartyMatchesRequest {
  string tenant_id = 1;
  string connection_id = 2;
  string original_doc_id = 3;
}

message GetOriginalPartyMatchesResponse {
  OriginalEntityMatch seller = 1;
  OriginalEntityMatch buyer = 2;
}

message GetOriginalStoreMatchRequest {
  string tenant_id = 1;
  string connection_id = 2;
  string original_doc_id = 3;
}

message GetOriginalStoreMatchResponse {
  OriginalEntityMatch store = 1;
}

message OriginalEntityMatch {
  string entity_type = 1;
  string entity_id = 2;
}

message StreamOriginalDocumentMatchesRequest {
  string tenant_id = 1;
  string connection_id = 2;
  string original_doc_id = 3;
}

message OriginalDocumentMatchEvent {
  string kind = 1; // "seller" | "buyer" | "store" | "item" | "done"
  string status = 2; // "matched" | "empty" | "error" | "done"
  string key = 3; // "supplier" | "buyer" | "warehouse" | "position-0"
  int32 original_position_index = 4; // only for item
  OriginalMatchedEntity entity = 5;
  string error = 6; // only for status="error"
}

message OriginalMatchedEntity {
  string entity_type = 1;
  string entity_id = 2;
  string name = 3;
  string article = 4; // item only
  string item_code = 5; // item only
  repeated string gtin = 6; // item only
  repeated string barcodes = 7; // item only
  string inn = 8; // party only
  string kpp = 9; // party only
  string code = 10; // store only
  string address = 11; // store only
}

message OriginalDocumentEntry {
  string tenant_id = 1;
  string id = 2;
  string condition = 19;
  string file_name = 20;
  string file_ext = 21;
  string source = 22;
  bytes payload_meta = 9;
  bytes payload_header = 10;
  bytes payload_summary = 11;
  bytes payload_positions = 12;
  bytes payload_footer = 17;
  bytes payload_attributes = 18;
  string payload_hash = 8;
  google.protobuf.Timestamp payloaded_at = 13;
}

// ===== ERPEntity =====

message ListERPEntitiesRequest {
  string tenant_id = 1;
  string connection_id = 2;
  string entity_type = 3;
  int32 limit = 4;
  int32 offset = 5;
  string search = 6;
}

message ListERPEntitiesResponse {
  repeated ERPEntityEntry items = 1;
  int32 total_count = 2;
}

message ERPEntityEntry {
  string tenant_id = 1;
  string account_id = 2;
  string entity_type = 4;
  string id = 5;
  bytes payload_entity = 13;
  google.protobuf.Timestamp payloaded_at = 7;
}

// ===== ERPDocument =====

message ListERPDocumentsRequest {
  string tenant_id = 1;
  string connection_id = 2;
  string entity_type = 3;
  int32 limit = 4;
  int32 offset = 5;
}

message ListERPDocumentsResponse {
  repeated ERPDocumentEntry items = 1;
  int32 total_count = 2;
}

message ERPDocumentEntry {
  string tenant_id = 1;
  string account_id = 2;
  string entity_type = 4;
  string entity_id = 5;
  bytes payload_meta = 6;
  bytes payload_header = 7;
  bytes payload_summary = 8;
  bytes payload_positions = 9;
  bytes payload_footer = 17;
  bytes payload_attributes = 18;
  string payload_hash = 10;
  google.protobuf.Timestamp payloaded_at = 11;
}

message GetERPDocumentRequest {
  string tenant_id = 1;
  string connection_id = 2;
  string entity_type = 3;
  string entity_id = 4;
}

message GetERPDocumentResponse {
  ERPDocumentEntry document = 1;
}

// ===== ERPDocumentCounts =====

message GetERPDocumentCountsRequest {
  string tenant_id = 1;
  string connection_id = 2;
}

message GetERPDocumentCountsResponse {
  repeated ERPDocumentCountEntry items = 1;
}

message ERPDocumentCountEntry {
  string entity_type = 1;
  int32 count = 2;
}

// ===== MatchKB (база сопоставлений / KBPage) =====

message ListMatchKBRequest {
  string tenant_id = 1;
  string connection_id = 2;
  string search = 3;          // по original_name / erp_entity_name; "" = без поиска
  string erp_supplier_id = 4; // фильтр по поставщику (ERP-id matched-контрагента); "" = все
  string matched_by = 5;      // "all" | "human" | "machine"
  int32 limit = 6;
  int32 offset = 7;
}

message ListMatchKBResponse {
  repeated MatchKBEntry items = 1;
  int32 total_count = 2;
  MatchKBStats stats = 3;
}

message MatchKBEntry {
  string id = 1;                     // составной ключ строки (fingerprint:erp_entity_type:erp_entity_id)
  string erp_entity_type = 2;        // "product" | "service" | "bundle" | "variant"
  string erp_entity_id = 3;
  string erp_entity_code = 4;        // числовой код МС
  string erp_entity_name = 5;        // наименование МС
  string original_name = 6;          // читаемое имя из исходного документа
  string original_doc_type = 7;      // тип документа-источника
  string original_supplier_name = 8; // контрагент-источник (у original нет id)
  string original_buyer_name = 9;    // покупатель-источник (у original нет id)
  bool matched_by_machine = 10;      // true=машина (эвристика/LLM), false=человек → contract source
  string matched_by = 11;            // "heuristic" | "llm" | "manual"
}

message MatchKBStats {
  int32 human = 1;
  int32 machine = 2;
  int32 total = 3;
}
