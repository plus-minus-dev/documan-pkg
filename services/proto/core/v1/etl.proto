syntax = "proto3";
package documan.core.v1;

option go_package = "github.com/plus-minus-dev/documan-pkg/services/gen/core/v1";

service CoreETLService {
  rpc NotifyERPDataReady(NotifyERPDataReadyRequest) returns (NotifyERPDataReadyResponse);
  rpc NotifyIngestDataReady(NotifyIngestDataReadyRequest) returns (NotifyIngestDataReadyResponse);
  rpc GetActiveConnections(GetActiveConnectionsRequest) returns (GetActiveConnectionsResponse);
}

// ===== NotifyERPDataReady =====

message NotifyERPDataReadyRequest {
  string tenant_id = 1;
  string connection_id = 2;
  string entity_type = 4;
  repeated ERPDataEntry items = 5;
}

message ERPDataEntry {
  string entity_id = 1;
  bytes payload_entity = 2;
  bytes payload_meta = 3;
  bytes payload_header = 4;
  bytes payload_summary = 5;
  bytes payload_positions = 6;
  bytes payload_footer = 8;
  bytes payload_attributes = 9;
  string payload_hash = 7;
}

// ===== NotifyIngestDataReady =====

message NotifyIngestDataReadyRequest {
  string tenant_id = 1;
  repeated IngestDataEntry items = 4;
}

message IngestDataEntry {
  string id = 1;
  bytes payload_meta = 2;
  bytes payload_header = 3;
  bytes payload_summary = 4;
  bytes payload_positions = 5;
  bytes payload_footer = 8;
  bytes payload_attributes = 9;
  string payload_hash = 6;
}

// ===== Responses =====

message RejectedItem {
  string id = 1;
  string reason = 2;
}

message NotifyERPDataReadyResponse {
  int32 accepted = 1;
  repeated RejectedItem rejected = 2;
}

message NotifyIngestDataReadyResponse {
  int32 accepted = 1;
  repeated RejectedItem rejected = 2;
}

// ===== GetActiveConnections =====

message GetActiveConnectionsRequest {}

message GetActiveConnectionsResponse {
  repeated ActiveConnection items = 1;
}

message ActiveConnection {
  string tenant_id = 1;
  string connection_id = 2;
  string erp_type = 3;
  string erp_account_id = 4;
  bool enabled = 5;
  string status = 6;
  string auth_type = 7;
  string erp_token = 8;
  bytes provider_payload = 9;
  bool etl_eligible = 10;
}
