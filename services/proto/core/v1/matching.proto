syntax = "proto3";
package documan.core.v1;

option go_package = "github.com/plus-minus-dev/documan-pkg/services/gen/core/v1";

// CoreMatchingService -- matching pipeline: HITL decisions + queries.
service CoreMatchingService {
  // HITL: document decisions
  rpc DocApprove(DocApproveRequest) returns (DocApproveResponse);
  rpc DocReject(DocRejectRequest) returns (DocRejectResponse);
  rpc DocBreakLink(DocBreakLinkRequest) returns (DocBreakLinkResponse);

  // HITL: entity decisions
  rpc EntityApprove(EntityApproveRequest) returns (EntityApproveResponse);
  rpc EntityReject(EntityRejectRequest) returns (EntityRejectResponse);
  rpc EntityCorrect(EntityCorrectRequest) returns (EntityCorrectResponse);

  // Queries
  rpc ListPairs(ListPairsRequest) returns (ListPairsResponse);
  rpc GetDelta(GetDeltaRequest) returns (GetDeltaResponse);
  rpc ListKB(ListKBRequest) returns (ListKBResponse);

  // Queue status (debug page)
  rpc GetMatchingStatus(GetMatchingStatusRequest) returns (GetMatchingStatusResponse);

  // Detailed scoring + processing history for original document (debug page)
  rpc GetScoringDebug(GetScoringDebugRequest) returns (GetScoringDebugResponse);
}

// --- DocApprove ---

message DocApproveRequest {
  string tenant_id = 1;
  string id_set_document = 2;
  string original_doc_id = 3;
  string erp_doc_id = 4;
}

message DocApproveResponse {}

// --- DocReject ---

message DocRejectRequest {
  string tenant_id = 1;
  string id_set_document = 2;
  string original_doc_id = 3;
  string erp_doc_id = 4;
}

message DocRejectResponse {}

// --- DocBreakLink ---

message DocBreakLinkRequest {
  string tenant_id = 1;
  string id_set_document = 2;
  string original_doc_id = 3;
  string erp_doc_id = 4;
}

message DocBreakLinkResponse {}

// --- EntityApprove ---

message EntityApproveRequest {
  string tenant_id = 1;
  string connection_id = 2;
  string entity_type = 3;   // "counterparty" | "assortment" | "store"
  string fingerprint = 4;
}

message EntityApproveResponse {}

// --- EntityReject ---

message EntityRejectRequest {
  string tenant_id = 1;
  string connection_id = 2;
  string entity_type = 3;
  string fingerprint = 4;
}

message EntityRejectResponse {}

// --- EntityCorrect ---

message EntityCorrectRequest {
  string tenant_id = 1;
  string connection_id = 2;
  string entity_type = 3;
  string fingerprint = 4;
  string corrected_entity_id = 5;
}

message EntityCorrectResponse {}

// --- ListPairs ---

message ListPairsRequest {
  string tenant_id = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message ListPairsResponse {
  repeated PairItem pairs = 1;
  int32 total = 2;
}

message PairItem {
  string set_id = 1;
  bool has_delta = 2;
  string original_doc_id = 3;
  string erp_doc_id = 4;
}

// --- GetDelta ---

message GetDeltaRequest {
  string tenant_id = 1;
  string id_set_document = 2;
}

message GetDeltaResponse {
  bool has_delta = 1;
  repeated DeltaField fields = 2;
}

message DeltaField {
  string field = 1;
  string original = 2;
  string erp = 3;
}

// --- ListKB ---

message ListKBRequest {
  string tenant_id = 1;
  string entity_type = 2;   // "counterparty" | "assortment" | "store"
  int32 limit = 3;
  int32 offset = 4;
}

message ListKBResponse {
  repeated KBEntryItem entries = 1;
  int32 total = 2;
}

message KBEntryItem {
  string tenant_id = 1;
  string connection_id = 2;
  string fingerprint = 3;
  string entity_id = 4;
  string source = 5;
  string created_at = 6;
  string updated_at = 7;
}

// --- GetMatchingStatus ---

message GetMatchingStatusRequest {
  string tenant_id = 1;
}

message GetMatchingStatusResponse {
  int32 outbox_pending = 1;
  int32 matching_jobs_queued = 2;
  int32 matching_jobs_processing = 3;
  int32 entity_jobs_queued = 4;
  int32 entity_jobs_processing = 5;
}

// --- GetScoringDebug ---

message GetScoringDebugRequest {
  string tenant_id = 1;
  string original_doc_id = 2;
  string erp_doc_id = 3; // optional
  int32 limit = 4;
}

message GetScoringDebugResponse {
  string original_doc_id = 1;
  ScoreFeatureSnapshot source = 2;
  repeated ScoreCandidateDebug candidates = 3;
  repeated MatchingJobDebugItem jobs = 4;
  repeated OutboxEventDebugItem outbox_events = 5;
}

message ScoreFeatureSnapshot {
  string seller_inn = 1;
  string buyer_inn = 2;
  int64 amount_with_vat = 3;
  string doc_number = 4;
  string doc_date = 5;
  int32 sku_count = 6;
  double quantity_sum = 7;
}

message ScoreCandidateDebug {
  string erp_doc_id = 1;
  string connection_id = 2;
  string entity_type = 3;
  int32 total_score = 4;
  string status = 5;
  ScoreFeatureSnapshot target = 6;
  repeated ScoreParamDebug params = 7;
}

message ScoreParamDebug {
  string key = 1;
  int32 weight = 2;
  bool matched = 3;
  int32 points = 4;
  string original = 5;
  string erp = 6;
}

message MatchingJobDebugItem {
  string id = 1;
  string mode = 2;
  string status = 3;
  int32 attempts = 4;
  int32 max_attempts = 5;
  string error_message = 6;
  string created_at = 7;
  string updated_at = 8;
}

message OutboxEventDebugItem {
  string id = 1;
  string event_type = 2;
  string status = 3;
  int32 attempts = 4;
  int32 max_attempts = 5;
  string error_message = 6;
  string created_at = 7;
  string published_at = 8;
}
