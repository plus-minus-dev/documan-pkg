syntax = "proto3";
package documan.core.v1;

option go_package = "github.com/plus-minus-dev/documan-pkg/services/gen/core/v1";

// CoreDocMatchingService — сопоставление документов (v5).
service CoreDocMatchingService {
  // Поиск кандидатов для сопоставления
  rpc FindCandidates(FindCandidatesRequest) returns (FindCandidatesResponse);

  // Связать два документа
  rpc LinkDocuments(LinkDocumentsRequest) returns (LinkDocumentsResponse);

  // Разорвать связь
  rpc UnlinkDocuments(UnlinkDocumentsRequest) returns (UnlinkDocumentsResponse);

  // Получить дельту по паре
  rpc GetLinkDelta(GetLinkDeltaRequest) returns (GetLinkDeltaResponse);

  // Список групп
  rpc ListGroups(ListGroupsRequest) returns (ListGroupsResponse);

  // Детали группы
  rpc GetGroup(GetGroupRequest) returns (GetGroupResponse);
}

// ===== FindCandidates =====

message FindCandidatesRequest {
  string tenant_id = 1;
  string connection_id = 2;
  string doc_id = 3;
}

message FindCandidatesResponse {
  repeated CandidateItem candidates = 1;
}

message CandidateItem {
  string doc_id = 1;
  string doc_type = 2;       // "original" | "erp"
  string entity_type = 3;    // "supply", "invoicein", ...
  MatchResult match_result = 4;
  // Display fields (from extracted features)
  string seller_inn = 5;
  string buyer_inn = 6;
  string doc_number = 7;
  string doc_date = 8;
}

message MatchResult {
  optional bool seller_inn = 1;
  optional bool buyer_inn = 2;
  optional bool amount_with_vat = 3;
  optional bool doc_number = 4;
  optional bool doc_date = 5;
  optional bool sku_count = 6;
  optional bool quantity_sum = 7;
  optional bool store = 8;
}

// ===== LinkDocuments =====

message LinkDocumentsRequest {
  string tenant_id = 1;
  string doc_a_id = 2;
  string doc_b_id = 3;
  string linked_by = 4;
}

message LinkDocumentsResponse {
  string group_id = 1;
  string doc_a_id = 2;
  string doc_b_id = 3;
  bool has_delta = 4;
}

// ===== UnlinkDocuments =====

message UnlinkDocumentsRequest {
  string tenant_id = 1;
  string doc_a_id = 2;
  string doc_b_id = 3;
}

message UnlinkDocumentsResponse {}

// ===== GetLinkDelta =====

message GetLinkDeltaRequest {
  string tenant_id = 1;
  string doc_a_id = 2;
  string doc_b_id = 3;
}

message GetLinkDeltaResponse {
  bool has_delta = 1;
  repeated FieldDiff header = 2;
  repeated FieldDiff summary = 3;
  PositionsDelta positions = 4;
}

message FieldDiff {
  string field = 1;
  string value_a = 2;
  string value_b = 3;
}

message PositionsDelta {
  int32 matched = 1;
  repeated PositionDiff mismatched = 2;
  repeated PositionRef only_a = 3;
  repeated PositionRef only_b = 4;
}

message PositionDiff {
  int32 index = 1;
  string field = 2;
  string value_a = 3;
  string value_b = 4;
}

message PositionRef {
  int32 index = 1;
  string name = 2;
}

// ===== ListGroups =====

message ListGroupsRequest {
  string tenant_id = 1;
  optional bool has_delta = 2;
  int32 limit = 3;
  int32 offset = 4;
}

message ListGroupsResponse {
  repeated GroupItem groups = 1;
  int32 total_count = 2;
}

message GroupItem {
  string group_id = 1;
  bool has_delta = 2;
  int32 doc_count = 3;
}

// ===== GetGroup =====

message GetGroupRequest {
  string tenant_id = 1;
  string group_id = 2;
}

message GetGroupResponse {
  string group_id = 1;
  repeated GroupDocItem documents = 2;
  repeated GroupLinkItem links = 3;
}

message GroupDocItem {
  string doc_id = 1;
  string doc_type = 2;
  string entity_type = 3;
}

message GroupLinkItem {
  string doc_a_id = 1;
  string doc_b_id = 2;
  bool has_delta = 3;
  optional GetLinkDeltaResponse delta = 4;
}
